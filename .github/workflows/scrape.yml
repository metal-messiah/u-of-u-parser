name: Scrape U of U pediatric NP/APRN jobs

on:
  schedule:
    # Off-the-hour minute so this doesn't line up with every other repo's
    # top-of-hour cron and queue behind them.
    - cron: "17 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm run scrape

      - name: Commit updated data and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json docs/index.html docs/evaluated.html
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Update job data ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git push
